<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="ball" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Bola de nieve (3 círculos crecientes) -->
  <circle cx="160" cy="380" r="44" fill="url(#ball)" opacity="0.9"/>
  <circle cx="220" cy="320" r="62" fill="url(#ball)" opacity="0.95"/>
  <circle cx="310" cy="230" r="92" fill="url(#ball)"/>
  <!-- Símbolo $ en la bola grande -->
  <text x="310" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="120" font-weight="900" fill="#047857">$</text>
  <!-- Rastro de nieve / movimiento -->
  <path d="M70 440 Q 150 410 240 380 T 410 280" stroke="#ffffff" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.35" stroke-dasharray="4 12"/>
</svg>
